<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 20px;
        box-sizing: border-box;
        font-family: system-ui, sans-serif;
        background: #f8fafc;
        text-align: center;
      }

      .card {
        max-width: 420px;
        padding: 40px;
        border-radius: 20px;
        background: white;
        box-shadow: 0 10px 25px rgba(15, 23, 42, 0.08);
      }

      img {
        width: 96px;
      }

      button {
        margin-top: 12px;
        padding: 12px 24px;
        border: 0;
        border-radius: 999px;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        color: white;
        font-weight: 700;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="/icon.svg" alt="">
      <h1>Je bent offline</h1>
      <p>Controleer je internetverbinding en probeer het opnieuw.</p>
      <button onclick="location.reload()">Opnieuw proberen</button>
    </div>
  </body>
</html>
